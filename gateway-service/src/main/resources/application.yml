spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/usuarios/**
            - id: game-service
              uri: lb://game-service
              predicates:
                - Path=/api/v1/juegos/**
            - id: team-service
              uri: lb://team-service
              predicates:
                - Path=/api/v1/equipos/**
            - id: tournament-service
              uri: lb://tournament-service
              predicates:
                - Path=/api/v1/torneos/**
            - id: match-service
              uri: lb://match-service
              predicates:
                - Path=/api/v1/partidas/**
            - id: sanction-service
              uri: lb://sanction-service
              predicates:
                - Path=/api/v1/sanciones/**
            - id: registration-service
              uri: lb://registration-service
              predicates:
                - Path=/api/v1/inscripciones/**
            - id: ranking-service
              uri: lb://ranking-service
              predicates:
                - Path=/api/v1/rankings/**
            - id: result-service
              uri: lb://result-service
              predicates:
                - Path=/api/v1/resultados/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notificaciones/**

            # Rutas para el OpenAPI (JSON) de cada microservicio para Swagger UI
            - id: user-api-docs
              uri: lb://user-service
              predicates:
                - Path=/api-docs/usuarios
              filters:
                - RewritePath=/api-docs/usuarios, /v3/api-docs
            - id: game-api-docs
              uri: lb://game-service
              predicates:
                - Path=/api-docs/juegos
              filters:
                - RewritePath=/api-docs/juegos, /v3/api-docs
            - id: team-api-docs
              uri: lb://team-service
              predicates:
                - Path=/api-docs/equipos
              filters:
                - RewritePath=/api-docs/equipos, /v3/api-docs
            - id: tournament-api-docs
              uri: lb://tournament-service
              predicates:
                - Path=/api-docs/torneos
              filters:
                - RewritePath=/api-docs/torneos, /v3/api-docs
            - id: match-api-docs
              uri: lb://match-service
              predicates:
                - Path=/api-docs/partidas
              filters:
                - RewritePath=/api-docs/partidas, /v3/api-docs
            - id: sanction-api-docs
              uri: lb://sanction-service
              predicates:
                - Path=/api-docs/sanciones
              filters:
                - RewritePath=/api-docs/sanciones, /v3/api-docs
            - id: registration-api-docs
              uri: lb://registration-service
              predicates:
                - Path=/api-docs/inscripciones
              filters:
                - RewritePath=/api-docs/inscripciones, /v3/api-docs
            - id: ranking-api-docs
              uri: lb://ranking-service
              predicates:
                - Path=/api-docs/rankings
              filters:
                - RewritePath=/api-docs/rankings, /v3/api-docs
            - id: result-api-docs
              uri: lb://result-service
              predicates:
                - Path=/api-docs/resultados
              filters:
                - RewritePath=/api-docs/resultados, /v3/api-docs
            - id: notification-api-docs
              uri: lb://notification-service
              predicates:
                - Path=/api-docs/notificaciones
              filters:
                - RewritePath=/api-docs/notificaciones, /v3/api-docs

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  swagger-ui:
    enabled: true
    path: /docs/swagger-ui.html
    urls:
      - name: usuarios
        url: /api-docs/usuarios
      - name: juegos
        url: /api-docs/juegos
      - name: equipos
        url: /api-docs/equipos
      - name: torneos
        url: /api-docs/torneos
      - name: partidas
        url: /api-docs/partidas
      - name: sanciones
        url: /api-docs/sanciones
      - name: inscripciones
        url: /api-docs/inscripciones
      - name: rankings
        url: /api-docs/rankings
      - name: resultados
        url: /api-docs/resultados
      - name: notificaciones
        url: /api-docs/notificaciones

jwt:
  secret: clave-secreta-super-segura-para-jwt-hospital-msvc-duoc-2026-0616
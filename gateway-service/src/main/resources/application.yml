server:
  port: 8000

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/usuarios/**
            - id: game-service
              uri: lb://game-service
              predicates:
                - Path=/api/v1/juegos/**
            - id: team-service
              uri: lb://team-service
              predicates:
                - Path=/api/v1/equipos/**
            - id: tournament-service
              uri: lb://tournament-service
              predicates:
                - Path=/api/v1/torneos/**
            - id: registration-service
              uri: lb://registration-service
              predicates:
                - Path=/api/v1/inscripciones/**
            - id: match-service
              uri: lb://match-service
              predicates:
                - Path=/api/v1/partidas/**
            - id: result-service
              uri: lb://result-service
              predicates:
                - Path=/api/v1/resultados/**
            - id: ranking-service
              uri: lb://ranking-service
              predicates:
                - Path=/api/v1/rankings/**
            - id: sanction-service
              uri: lb://sanction-service
              predicates:
                - Path=/api/v1/sanciones/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notificaciones/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true